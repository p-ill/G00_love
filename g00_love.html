<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>구의 호감도를 올려줘!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#fff3ec; --panel:#ffe3d6; --line:#e98b76; --accent:#f7b39f; --accent-2:#ffd3b8;
  --ink:#6f3a30; --soft:#b86e5e; --shadow:#e9a592; --white:#fffaf6;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#2e2220; --panel:#43302c; --line:#d98b79; --accent:#b8675a; --accent-2:#5b3b34;
    --ink:#ffe6dc; --soft:#e7b3a4; --shadow:#1f1614; --white:#3a2a27;
  }
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:16px;line-height:1.5;min-height:100vh;display:flex;justify-content:center;padding:16px}
.app{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
.px{border:3px solid var(--line);background:var(--panel);box-shadow:4px 4px 0 var(--shadow);border-radius:4px}
.top{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:space-between;padding:10px 12px;font-size:12px;font-family:'Press Start 2P','Noto Sans KR',monospace;line-height:1.7}
.top span{white-space:nowrap}
.top b{font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:700;color:var(--soft);margin-right:6px}
.top em{font-style:normal;color:var(--line)}
.frame{padding:8px;background:var(--white)}
.frame img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border:3px solid var(--line);border-radius:2px;image-rendering:auto}
.dialog{position:relative;padding:22px 16px 16px;background:var(--white);min-height:112px}
.tag{position:absolute;top:-16px;left:12px;background:var(--accent);color:var(--ink);border:3px solid var(--line);padding:0 12px;font-size:14px;font-weight:700;border-radius:4px}
.line{margin:0;font-size:17px;min-height:3em;word-break:keep-all}
.status{margin:0;font-size:14px;color:var(--soft);text-align:center;min-height:1.4em}
.status.on{color:var(--line);font-weight:700}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{font:inherit;font-size:16px;font-weight:400;color:var(--ink);text-align:left;cursor:pointer;background:var(--accent-2);border:3px solid var(--line);border-radius:4px;box-shadow:3px 3px 0 var(--shadow);padding:10px 14px 10px 38px;position:relative;transition:transform .08s,box-shadow .08s,background .12s}
.choice::before{content:"♡";position:absolute;left:13px;top:10px;color:var(--line)}
.choice:hover{background:var(--accent)}
.choice:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--shadow)}
.choice:focus-visible,.reset:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.choice[aria-pressed="true"]{font-weight:700;background:var(--accent);transform:translate(3px,3px);box-shadow:0 0 0 var(--shadow)}
.choice[aria-pressed="true"]::before{content:"♥"}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--soft)}
.reset{font:inherit;font-size:13px;color:var(--soft);background:none;border:2px dashed var(--line);border-radius:4px;padding:2px 10px;cursor:pointer}
.reset:hover{color:var(--ink);background:var(--accent-2)}
@media (prefers-reduced-motion:reduce){.choice{transition:none}}
</style>
</head>
<body>
<main class="app">
  <header class="top px" aria-label="상태">
    <span><b>기본 애정도</b><em id="aff">100</em></span>
    <span><b>관계</b><em id="rel">FRIEND</em></span>
    <span><em id="day">D+??</em></span>
  </header>

  <div class="frame px"><img id="pic" alt="구"></div>

  <section class="dialog px" aria-live="polite">
    <div class="tag">구</div>
    <p class="line" id="line"></p>
  </section>

  <p class="status" id="status">답장을 선택하세요.</p>

  <div class="choices" id="choices"></div>

  <div class="foot"><span>템플릿 출처: @cateatinglemon</span><button class="reset" id="reset" type="button">처음으로</button></div>
</main>

const $ = id => document.getElementById(id);
const pic = $("pic"), lineEl = $("line"), affEl = $("aff"), statusEl = $("status"), box = $("choices");
$("rel").textContent = CONFIG.relation; $("day").textContent = CONFIG.day;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let timer = null;

function say(text){
  clearInterval(timer);
  let i = 0; lineEl.textContent = "";
  timer = setInterval(() => { lineEl.textContent = text.slice(0, ++i); if (i >= text.length) clearInterval(timer); }, 38);
}
function setPressed(idx){ [...box.children].forEach((b, i) => b.setAttribute("aria-pressed", String(i === idx))); }
function reset(){
  pic.src = IMAGES[CONFIG.idle.img]; affEl.textContent = CONFIG.base;
  statusEl.textContent = "답장을 선택하세요."; statusEl.classList.remove("on");
  setPressed(-1); say(CONFIG.idle.line);
}
function choose(idx){
  const c = CONFIG.choices[idx];
  pic.src = IMAGES[c.img]; affEl.textContent = CONFIG.base + c.add;
  statusEl.textContent = CONFIG.name + " 님의 애정도가 변경되었습니다. " + (c.add > 0 ? "+" : "") + c.add; statusEl.classList.add("on");
  setPressed(idx); say(c.reply);
}
CONFIG.choices.forEach((c, i) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "choice"; b.textContent = c.label; b.setAttribute("aria-pressed", "false");
  b.addEventListener("click", () => choose(i)); box.appendChild(b);
});
$("reset").addEventListener("click", reset);
